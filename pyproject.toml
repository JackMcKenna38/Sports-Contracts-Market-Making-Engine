[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tickbook"
version = "0.1.0"
description = "Research market-making engine for Polymarket NBA and NHL moneylines: recorder, fair value, backtester and paper trader. No live orders."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0",
    "websockets>=17.4",
]

[project.scripts]
mm = "mm.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: hits live endpoints; run nightly, not on every push",
]

[tool.coverage.run]
source = ["src/mm"]
omit = ["src/mm/cli.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
